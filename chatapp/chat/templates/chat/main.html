<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Accueil</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'chat/main.css' %}">
    </head>
<body>
    <div class="app-shell">
        <div class="header">
            <div>💬 Chat App</div>
            <div style="display:flex; align-items:center; gap:12px;">
                <span>Bienvenue, <strong id="username">{{ user.username }}</strong></span>
                <div class="notification-mini-tab" id="notification-tab" onclick="toggleNotificationDropdown()">
                    🔔 Notifications
                    <div class="notification-count" id="notification-count" style="display: none;">0</div>
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-empty" id="notification-empty">Rien à signaler par ici</div>
                    </div>
                </div>
                <form method="post" action="/accounts/logout/" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" style="background: none; border: none; color: #e3e5e8; text-decoration: underline; cursor: pointer;">Se déconnecter</button>
                </form>
            </div>
        </div>

        <aside class="servers-rail" id="servers-rail">
            <div class="server-bubble" id="server-menu" title="Menus" onclick="selectServer('menus')">≡</div>
            <div class="server-bubble active" id="server-direct" title="Privés" onclick="selectServer('direct')">💬</div>
            <div class="server-bubble" id="server-groups" title="Groupes" onclick="selectServer('groups')">👥</div>
            <div class="server-conversation-select-wrapper">
                <select id="server-conversation-select" class="server-conversation-select" onchange="selectConversationFromSelect(this.value)" title="Changer de conversation">
                    <option value="">💬</option>
                </select>
            </div>
        </aside>

        <section class="channels-pane">
            <div class="channels-header" id="channels-title">Conversations</div>
            <div class="channel-list" id="channel-list"></div>
            <div style="padding:12px; border-top:1px solid #202225;" id="channels-actions"></div>
        </section>

        <main class="main-pane" id="main-pane">
            <div class="drag-overlay">📎 Déposez votre fichier ici</div>
            <div class="main-header" id="main-title">Sélectionnez une conversation</div>
            <div class="messages" id="chat-messages" 
                 hx-trigger="loadMessages from:body"
                 hx-get="/htmx/messages/" 
                 hx-target="#chat-messages" 
                 hx-swap="innerHTML"
                 hx-vals='js:{"conversation_id": getCurrentConversationId()}'
                 hx-on::after-swap="scrollToBottom()">
            </div>
            <div class="composer" id="composer">
                <input type="file" id="file-input" style="max-width: 260px;" />
                <form id="message-form" 
                      hx-post="/htmx/send-message/" 
                      hx-target="#chat-messages" 
                      hx-swap="beforeend"
                      hx-indicator="#sending-indicator"
                      onsubmit="return handleHtmxSubmit(event)">
                    {% csrf_token %}
                    <input type="hidden" name="conversation_id" id="htmx-conversation-id" />
                    <input type="text" name="content" id="message-input" placeholder="Tapez votre message..." onkeypress="handleKeyPress(event)" style="flex: 1; background: #1e1f22; border: 1px solid #3a3c41; border-radius: 8px; color: #fff; padding: 10px 12px;" />
                    <button type="submit" class="btn" style="position: relative; padding: 10px 20px;">
                        <span id="sending-indicator" class="htmx-indicator">Envoi...</span>
                        <span>Envoyer</span>
                    </button>
                </form>
            </div>
        </main>
    </div>
    
    <!-- Notifications -->
    <div id="notification" class="notification"></div>
    
    <!-- Notification popup -->
    <div id="notification-popup" class="notification-popup">
        <div class="notification-header">
            <div class="notification-title" id="popup-title">Notification</div>
            <button class="notification-close" onclick="closeNotificationPopup()">×</button>
        </div>
        <div class="notification-body" id="popup-body">Contenu de la notification</div>
        <div class="notification-actions" id="popup-actions" style="display: none;">
            <button class="notification-btn" id="popup-action-btn">Action</button>
        </div>
    </div>
    
    <script>
        let currentConversation = null;
        let ws = null;
        let notificationWs = null;
        let unreadCounts = {};
        let messages = []; // Stocker les messages pour gérer l'affichage des dates
        let receivedMessageIds = new Set(); // Track des IDs de messages déjà reçus pour éviter les doublons
        
        // Système de notifications
        let notifications = [];
        let notificationTimeout = null;
        let isNotificationDropdownOpen = false;
        
        // Récupérer le token CSRF
        let csrfToken = null;
        
        async function getCSRFToken() {
            if (csrfToken) return csrfToken;
            
            try {
                const res = await fetch('/api/csrf-token/');
                const data = await res.json();
                csrfToken = data.csrfToken;
                return csrfToken;
            } catch (error) {
                console.error('Erreur lors de la récupération du token CSRF:', error);
                return null;
            }
        }
        
        // Headers par défaut avec CSRF
        async function getHeaders() {
            const token = await getCSRFToken();
            return {
                'Content-Type': 'application/json',
                'X-CSRFToken': token
            };
        }
        
        // État de la colonne de gauche (rail + channels)
        let currentServer = 'direct'; // 'menus' | 'direct' | 'groups'
        function selectServer(kind) {
            currentServer = kind;
            document.querySelectorAll('.server-bubble').forEach(b => b.classList.remove('active'));
            if (kind === 'menus') document.getElementById('server-menu').classList.add('active');
            if (kind === 'direct') document.getElementById('server-direct').classList.add('active');
            if (kind === 'groups') document.getElementById('server-groups').classList.add('active');
            renderChannels();
            refreshSelectors();
        }
        
        // Charger les conversations
        async function loadConversations() {
            try {
                const headers = await getHeaders();
                const [directRes, groupRes] = await Promise.all([
                    fetch('/api/conversations/by-type/?type=direct', {
                        headers: headers
                    }),
                    fetch('/api/conversations/by-type/?type=group', {
                        headers: headers
                    })
                ]);
                
                const directConvs = await directRes.json();
                const groupConvs = await groupRes.json();
                
                window.__directConvs = directConvs;
                window.__groupConvs = groupConvs;
                renderChannels();
                updateConversationSelect();
            } catch (error) {
                showNotification('Erreur lors du chargement des conversations', 'error');
            }
        }
        
        // Mettre à jour le sélecteur de conversations dans servers-rail
        function updateConversationSelect() {
            const select = document.getElementById('server-conversation-select');
            if (!select) return;
            
            // Récupérer toutes les conversations
            const allConvs = [...(window.__directConvs || []), ...(window.__groupConvs || [])];
            
            // Sauvegarder la valeur actuelle (conversation active)
            const currentValue = currentConversation || select.value;
            
            // Déterminer quelle icône afficher pour la conversation active
            let activeIcon = '💬';
            let activeConv = null;
            if (currentValue) {
                activeConv = allConvs.find(c => String(c.id) === String(currentValue));
                if (activeConv) {
                    if (activeConv.type === 'direct') {
                        const otherUser = activeConv.memberships?.find(m => m.user.id !== {{ user.id|escapejs }})?.user;
                        activeIcon = otherUser ? '@' : '💬';
                    } else {
                        activeIcon = '#';
                    }
                }
            }
            
            // Vider le sélecteur
            select.innerHTML = '';
            
            // Option par défaut avec l'icône de la conversation active
            const defaultOption = document.createElement('option');
            defaultOption.value = currentValue || '';
            defaultOption.textContent = activeIcon;
            if (currentValue) {
                defaultOption.selected = true;
            }
            select.appendChild(defaultOption);
            
            // Ajouter les autres conversations
            allConvs.forEach(conv => {
                // Ne pas ajouter la conversation active dans la liste (déjà dans l'option par défaut)
                if (String(conv.id) === String(currentValue)) {
                    return;
                }
                
                let displayName = '';
                if (conv.type === 'direct') {
                    const otherUser = conv.memberships?.find(m => m.user.id !== {{ user.id|escapejs }})?.user;
                    displayName = otherUser ? `@ ${otherUser.username}` : `Direct ${conv.id}`;
                } else {
                    displayName = `# ${conv.name || `Groupe ${conv.id}`}`;
                }
                
                const option = document.createElement('option');
                option.value = conv.id;
                option.textContent = displayName;
                select.appendChild(option);
            });
        }
        
        // Sélectionner une conversation depuis le sélecteur
        function selectConversationFromSelect(conversationId) {
            if (!conversationId) return;
            
            const allConvs = [...(window.__directConvs || []), ...(window.__groupConvs || [])];
            const conv = allConvs.find(c => c.id == conversationId);
            
            if (!conv) return;
            
            let title = '';
            if (conv.type === 'direct') {
                const otherUser = conv.memberships?.find(m => m.user.id !== {{ user.id|escapejs }})?.user;
                title = otherUser ? otherUser.username : `Direct ${conv.id}`;
            } else {
                title = conv.name || `Groupe ${conv.id}`;
            }
            
            openChat(conversationId, title);
        }
        
        function renderChannels() {
            const list = document.getElementById('channel-list');
            const actions = document.getElementById('channels-actions');
            const title = document.getElementById('channels-title');
            list.innerHTML = '';
            actions.innerHTML = '';
            if (currentServer === 'menus') {
                title.textContent = 'Menus';
                // Menus: Contacts + Invitations
                const menus = [
                    { id: 'menu-contacts', label: 'Contacts', onClick: () => loadContactsPanel() },
                    { id: 'menu-invitations', label: 'Invitations', onClick: () => loadInvitationsPanel() }
                ];
                menus.forEach(menu => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.textContent = menu.label;
                    item.onclick = menu.onClick;
                    list.appendChild(item);
                });
            } else if (currentServer === 'direct') {
                title.textContent = 'Conversations privées';
                (window.__directConvs || []).forEach(conv => {
                    const otherUser = conv.memberships?.find(m => m.user.id !== {{ user.id|escapejs }})?.user;
                    const displayName = otherUser ? otherUser.username : `Direct ${conv.id}`;
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `<span>@ ${displayName}</span><span class="badge" id="badge-${conv.id}" style="display:none;"></span>`;
                    item.onclick = () => openChat(conv.id, displayName);
                    list.appendChild(item);
                });
                // Action: créer direct
                const actionsHtml = `
                    <div style="display:flex; gap:8px; align-items:center;">
                        <select id="contact-select" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                            <option value="">-- Choisir un contact --</option>
                        </select>
                        <button class="btn" onclick="createDirectFromContact()">Créer</button>
                    </div>`;
                actions.innerHTML = actionsHtml;
            } else if (currentServer === 'groups') {
                title.textContent = 'Groupes';
                (window.__groupConvs || []).forEach(conv => {
                    const displayName = conv.name || `Groupe ${conv.id}`;
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `<span># ${displayName}</span><span class="badge" id="badge-${conv.id}" style="display:none;"></span>`;
                    item.onclick = () => openChat(conv.id, displayName);
                    list.appendChild(item);
                });
                const actionsHtml = `
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div style="display:flex; gap:8px;">
                            <input type="text" id="group-name" placeholder="Nom du groupe" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                            <button class="btn" onclick="createGroupConversation()">Créer</button>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <select id="group-select" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                                <option value="">-- Choisir un groupe --</option>
                            </select>
                            <select id="group-invite-select" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                                <option value="">-- Choisir un contact --</option>
                            </select>
                            <input type="text" id="group-invite-username" placeholder="Ou nom d'utilisateur" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                            <button class="btn" onclick="inviteToGroup()">Inviter</button>
                        </div>
                    </div>`;
                actions.innerHTML = actionsHtml;
            }
        }
        
        // Charger les contacts
        async function loadContacts() {
            try {
                const headers = await getHeaders();
                const [pendingRes, acceptedRes] = await Promise.all([
                    fetch('/api/contacts/pending/', {
                        headers: headers
                    }),
                    fetch('/api/contacts/accepted/', {
                        headers: headers
                    })
                ]);
                
                const pendingContacts = await pendingRes.json();
                const acceptedContacts = await acceptedRes.json();
                
                displayPendingContacts(pendingContacts);
                displayAcceptedContacts(acceptedContacts);
            } catch (error) {
                showNotification('Erreur lors du chargement des contacts', 'error');
            }
        }
        
        function displayPendingContacts(contacts) {
            const container = document.getElementById('pending-contacts');
            container.innerHTML = '';
            
            contacts.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <span>Demande de ${contact.from_user.username}</span>
                    <div>
                        <button class="btn btn-success" onclick="respondToContact(${contact.id}, 'accepted')">Accepter</button>
                        <button class="btn btn-danger" onclick="respondToContact(${contact.id}, 'blocked')">Refuser</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        function displayAcceptedContacts(contacts) {
            const container = document.getElementById('accepted-contacts');
            container.innerHTML = '';
            
            contacts.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'list-item';
                const otherUser = contact.from_user.username === '{{ user.username|escapejs }}' ? contact.to_user.username : contact.from_user.username;
                div.innerHTML = `
                    <span>${otherUser}</span>
                    <div>
                        <button class="btn btn-danger" onclick="deleteContact(${contact.id})" style="background-color: #dc3545; color: white; padding: 4px 8px; font-size: 12px;">Supprimer</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        // Charger les invitations
        async function loadInvitations() {
            try {
                const headers = await getHeaders();
                const res = await fetch('/api/group-invitations/pending/', {
                    headers: headers
                });
                const invitations = await res.json();
                
                displayInvitations(invitations);
            } catch (error) {
                showNotification('Erreur lors du chargement des invitations', 'error');
            }
        }
        
        function displayInvitations(invitations) {
            const container = document.getElementById('pending-invitations');
            container.innerHTML = '';
            
            invitations.forEach(invitation => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <span>Invitation dans "${invitation.conversation.name}" de ${invitation.from_user.username}</span>
                    <div>
                        <button class="btn btn-success" onclick="respondToInvitation(${invitation.id}, 'accepted')">Accepter</button>
                        <button class="btn btn-danger" onclick="respondToInvitation(${invitation.id}, 'declined')">Refuser</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        // Fonctions de contact
        async function sendContactRequest() {
            const username = document.getElementById('contact-username').value;
            if (!username) return;
            
            try {
                const headers = await getHeaders();
                const res = await fetch('/api/contacts/send-request/', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({username})
                });
                
                if (res.ok) {
                    showNotification('Demande envoyée !', 'success');
                    document.getElementById('contact-username').value = '';
                } else {
                    const error = await res.json();
                    showNotification(error.detail, 'error');
                }
            } catch (error) {
                showNotification('Erreur lors de l\'envoi', 'error');
            }
        }

        async function deleteContact(contactId) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce contact ?')) {
                return;
            }
            
            try {
                const headers = await getHeaders();
                const res = await fetch(`/api/contacts/${contactId}/delete/`, {
                    method: 'DELETE',
                    headers: headers
                });
                
                if (res.ok) {
                    showNotification('Contact supprimé !', 'success');
                    // Recharger la liste des contacts
                    loadContacts();
                } else {
                    const error = await res.json();
                    showNotification(error.detail, 'error');
                }
            } catch (error) {
                showNotification('Erreur lors de la suppression', 'error');
            }
        }
        
        async function respondToContact(contactId, status) {
            try {
                const headers = await getHeaders();
                // Mapper les statuts aux URLs correctes
                const actionMap = {
                    'accepted': 'accept',
                    'blocked': 'decline'
                };
                const action = actionMap[status] || status;
                const res = await fetch(`/api/contacts/${contactId}/${action}/`, {
                    method: 'POST',
                    headers: headers
                });
                
                if (res.ok) {
                    showNotification('Action effectuée !', 'success');
                    loadContacts();
                } else {
                    const error = await res.json();
                    showNotification(error.detail, 'error');
                }
            } catch (error) {
                showNotification('Erreur', 'error');
            }
        }
        
        // Fonctions d'invitation
        async function respondToInvitation(invitationId, status) {
            try {
                const headers = await getHeaders();
                // Mapper les statuts aux URLs correctes
                const actionMap = {
                    'accepted': 'accept',
                    'declined': 'decline'
                };
                const action = actionMap[status] || status;
                const res = await fetch(`/api/group-invitations/${invitationId}/${action}/`, {
                    method: 'POST',
                    headers: headers
                });
                
                if (res.ok) {
                    showNotification('Action effectuée !', 'success');
                    loadInvitations();
                    loadConversations(); // Recharger les conversations
                } else {
                    const error = await res.json();
                    showNotification(error.detail, 'error');
                }
            } catch (error) {
                showNotification('Erreur', 'error');
            }
        }
        
        // Fonctions de conversation
        async function createDirectConversation() {
            const username = document.getElementById('direct-username').value;
            if (!username) return;
            
            try {
                const headers = await getHeaders();
                const res = await fetch('/api/conversations/create-direct-by-username/', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({username})
                });
                
                if (res.ok) {
                    showNotification('Conversation créée !', 'success');
                    document.getElementById('direct-username').value = '';
                    loadConversations();
                } else {
                    const error = await res.json();
                    showNotification(error.detail, 'error');
                }
            } catch (error) {
                showNotification('Erreur lors de la création', 'error');
            }
        }
        
        async function createGroupConversation() {
            const name = document.getElementById('group-name').value;
            if (!name) return;
            
            try {
                const headers = await getHeaders();
                const res = await fetch('/api/conversations/create-group/', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({name})
                });
                
                if (res.ok) {
                    showNotification('Groupe créé !', 'success');
                    document.getElementById('group-name').value = '';
                    loadConversations();
                } else {
                    const error = await res.json();
                    showNotification(error.detail, 'error');
                }
            } catch (error) {
                showNotification('Erreur lors de la création', 'error');
            }
        }
        
        // Fonction pour obtenir l'ID de conversation actuelle (pour HTMX)
        function getCurrentConversationId() {
            return currentConversation || '';
        }
        
        // Fonction pour scroller en bas après le chargement des messages
        function scrollToBottom() {
            const container = document.getElementById('chat-messages');
            if (container) {
                setTimeout(() => {
                    container.scrollTop = container.scrollHeight;
                }, 100);
            }
        }
        
        // Fonction de chat avec HTMX
        function openChat(conversationId, title) {
            currentConversation = conversationId;
            document.getElementById('main-title').textContent = title;
            document.getElementById('htmx-conversation-id').value = conversationId;
            
            // Mettre à jour le sélecteur pour afficher la conversation active
            const select = document.getElementById('server-conversation-select');
            if (select) {
                select.value = conversationId;
            }
            
            console.log(`[HTMX] Ouverture chat ${conversationId}`);
            
            // Marquer les messages comme lus et mettre à jour les badges
            markConversationAsRead(conversationId);
            
            // Fermer la connexion WebSocket précédente
            if (ws) {
                ws.close();
            }
            
            // Charger les messages via HTMX
            htmx.trigger('body', 'loadMessages');
            
            // Nouvelle connexion WebSocket
            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${protocol}://${window.location.host}/ws/chat/${conversationId}/`);
            
            ws.onopen = () => {
                console.log('Connecté au chat');
                // Les messages sont chargés via HTMX maintenant
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.message) {
                    const messageId = data.message.id;
                    const senderId = (data.message.sender && typeof data.message.sender === 'object' && data.message.sender.id) 
                        ? data.message.sender.id 
                        : (typeof data.message.sender === 'number' ? data.message.sender : null);
                    const currentUserId = {{ user.id|escapejs }};
                    
                    // Ne pas afficher le message si on l'a déjà reçu (pour éviter les doublons)
                    if (receivedMessageIds.has(messageId)) {
                        console.log('[WS] Message', messageId, 'déjà reçu, ignoré');
                        return;
                    }
                    
                    // Marquer le message comme reçu
                    receivedMessageIds.add(messageId);
                    
                    // Ajouter à la liste et afficher (pour tous les utilisateurs, y compris l'expéditeur)
                    messages.push(data.message);
                    const prevMsg = messages.length > 1 ? messages[messages.length - 2] : null;
                    displayMessage(data.message, prevMsg);
                    
                    // Mettre à jour le badge de la conversation si on n'est pas dans cette conversation
                    if (senderId !== currentUserId && currentConversation !== conversationId) {
                        updateConversationBadge(conversationId, true);
                    }
                } else if (data.error) {
                    showNotification(data.error, 'error');
                }
            };
            
            ws.onclose = () => {
                console.log('Déconnecté du chat');
            };
            
            // Mettre à jour le sélecteur après ouverture
            updateConversationSelect();
        }
        
        // Gérer la soumission HTMX
        function handleHtmxSubmit(event) {
            const conversationId = document.getElementById('htmx-conversation-id').value;
            if (!conversationId) {
                event.preventDefault();
                showNotification('Sélectionnez une conversation', 'error');
                return false;
            }
            return true;
        }
        
        function closeChat() {
            if (ws) { ws.close(); ws = null; }
            currentConversation = null;
            messages = []; // Réinitialiser les messages
            receivedMessageIds.clear(); // Réinitialiser les IDs reçus
            document.getElementById('main-title').textContent = 'Sélectionnez une conversation';
            document.getElementById('chat-messages').innerHTML = '';
        }
        
        async function loadMessages() {
            try {
                const headers = await getHeaders();
                const res = await fetch(`/api/conversations/${currentConversation}/messages/`, {
                    headers: headers
                });
                const loadedMessages = await res.json();
                messages = loadedMessages;
                
                // Marquer tous les messages chargés comme reçus pour éviter les doublons
                receivedMessageIds.clear();
                loadedMessages.forEach(msg => {
                    if (msg.id) {
                        receivedMessageIds.add(msg.id);
                    }
                });
                
            const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                messages.forEach((msg, index) => displayMessage(msg, index > 0 ? messages[index - 1] : null));

        function isImageFile(filename) {
            if (!filename) return false;
            const lower = filename.toLowerCase();
            return [".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp", ".svg"].some(ext => lower.endsWith(ext));
        }

        function displayMessage(msg, prevMsg = null) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            const senderId = (msg.sender && typeof msg.sender === 'object' && msg.sender.id) ? msg.sender.id : (typeof msg.sender === 'number' ? msg.sender : null);
            const isOwn = senderId === {{ user.id }};
            div.className = `message ${isOwn ? 'own' : 'other'}`;
            
            // Gérer l'affichage du nom d'utilisateur
            let senderName = 'Utilisateur';
            if (msg.sender_username) {
                senderName = msg.sender_username;
            } else if (msg.sender && typeof msg.sender === 'object' && msg.sender.username) {
                senderName = msg.sender.username;
            } else if (msg.sender && typeof msg.sender === 'string') {
                senderName = msg.sender;
            }
            
            let attachmentHtml = '';
            const url = msg.attachment_url;
            if (url) {
                if (isImageFile(url)) {
                    attachmentHtml = `<div style="margin-top:6px;"><img src="${url}" alt="fichier" style="max-width: 320px; border-radius: 6px;" /></div>`;
                } else {
                    const filename = url.split('/').pop();
                    attachmentHtml = `<div style="margin-top:6px;"><a href="${url}" target="_blank" download rel="noopener">📎 Télécharger ${filename}</a></div>`;
                }
            }
            
            // Vérifier si on doit afficher la date (changement de jour)
            const msgDate = new Date(msg.created_at);
            let dateHtml = '';
            if (!prevMsg) {
                dateHtml = `<div style="text-align:center; margin:10px 0; color:#8e9297; font-size:11px;">${msgDate.toLocaleDateString()}</div>`;
            } else {
                const prevMsgDate = new Date(prevMsg.created_at);
                if (msgDate.toDateString() !== prevMsgDate.toDateString()) {
                    dateHtml = `<div style="text-align:center; margin:10px 0; color:#8e9297; font-size:11px;">${msgDate.toLocaleDateString()}</div>`;
                }
            }

            div.innerHTML = `
                ${dateHtml}
                <strong>${senderName}:</strong> ${msg.content || ''}
                ${attachmentHtml}
                <br><small>${new Date(msg.created_at).toLocaleTimeString()}</small>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const fileInput = document.getElementById('file-input');
            const message = (input.value || '').trim();
            const file = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;

                    const token = await getCSRFToken();
                    const form = new FormData();
                    form.append('content', message);
                    form.append('attachment', file);
                    const res = await fetch(`/api/conversations/${currentConversation}/send/`, {
                        method: 'POST',
                        headers: { 'X-CSRFToken': token },
                        body: form
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        showNotification(err.detail || 'Erreur envoi du fichier', 'error');
                        return;
                    }
                    // La diffusion temps réel arrivera via WebSocket (broadcast côté serveur)
                    input.value = '';

                    htmx.trigger('body', 'loadMessages');
                } catch (e) {
                    showNotification('Erreur réseau lors de l\'upload', 'error');
                }
                return;
            }

            // Pour le texte, on peut utiliser HTMX ou WebSocket
            // On garde WebSocket pour la diffusion temps réel, mais on peut aussi utiliser HTMX
            if (!message) return;
            
            // Option 1: Utiliser HTMX pour envoyer le message
            const form = document.getElementById('message-form');
            if (form && message) {
                // HTMX va gérer l'envoi automatiquement via le formulaire
                // On ne fait rien ici, HTMX s'en occupe
            } else {
                // Fallback WebSocket
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                ws.send(JSON.stringify({message}));
                input.value = '';
            }
        }

        // === DRAG & DROP FUNCTIONALITY ===
        function setupDragAndDrop() {
            const mainPane = document.getElementById('main-pane');
            const fileInput = document.getElementById('file-input');
            
            // Empêcher le comportement par défaut sur tout le document
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                document.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            // Gestion des événements de drag sur la zone principale
            ['dragenter', 'dragover'].forEach(eventName => {
                mainPane.addEventListener(eventName, handleDragEnter, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                mainPane.addEventListener(eventName, handleDragLeave, false);
            });
            
            mainPane.addEventListener('drop', handleDrop, false);
            
            function handleDragEnter(e) {
                mainPane.classList.add('dragging');
                mainPane.classList.add('drag-over');
            }
            
            function handleDragLeave(e) {
                // Ne retirer la classe que si on quitte vraiment la zone
                if (!mainPane.contains(e.relatedTarget)) {
                    mainPane.classList.remove('dragging');
                    mainPane.classList.remove('drag-over');
                }
            }
            
            function handleDrop(e) {
                mainPane.classList.remove('dragging');
                mainPane.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    // Afficher un message de confirmation
                    showNotification(`Fichier sélectionné : ${files[0].name}`, 'info');
                }
            }
        }

        // Configuration du WebSocket pour les notifications
        function setupNotificationWebSocket() {
            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            const wsUrl = `${protocol}://${window.location.host}/ws/notifications/`;
            console.log('[NOTIFICATIONS] Tentative de connexion WebSocket notifications:', wsUrl);
            notificationWs = new WebSocket(wsUrl);
            
            notificationWs.onopen = () => {
                console.log('[NOTIFICATIONS] ✅ Connecté au WebSocket notifications');
            };
            
            notificationWs.onmessage = (event) => {
                console.log('[NOTIFICATIONS] Message reçu:', event.data);
                try {
                    const data = JSON.parse(event.data);
                    console.log('[NOTIFICATIONS] Données parsées:', data);
                    
                    if (data.type === 'notification') {
                        const notification = data.notification;
                        console.log('[NOTIFICATIONS] Notification reçue:', notification);
                        // Ajouter la notification à la liste locale
                        notifications.unshift(notification);
                        updateNotificationUI();
                        
                        // Afficher le popup
                        showNotificationPopup(notification);
                    } else {
                        console.log('[NOTIFICATIONS] Type de message inconnu:', data.type);
                    }
                } catch (error) {
                    console.error('[NOTIFICATIONS] Erreur parsing message:', error, event.data);
                }
            };
            
            notificationWs.onerror = (error) => {
                console.error('[NOTIFICATIONS] ❌ Erreur WebSocket des notifications:', error);
            };
            
            notificationWs.onclose = (event) => {
                console.log('[NOTIFICATIONS] Déconnecté du WebSocket des notifications, code:', event.code, 'reason:', event.reason);
                // Reconnexion automatique après 5 secondes
                setTimeout(() => {
                    console.log('[NOTIFICATIONS] Tentative de reconnexion...');
                    setupNotificationWebSocket();
                }, 5000);
            };
        }

        async function deleteNotification(notificationId) {
            // Retirer immédiatement de la liste locale pour un feedback instantané
            notifications = notifications.filter(n => n.id !== notificationId);
            updateNotificationUI();
            
            try {
                const headers = await getHeaders();
                const res = await fetch(`/api/notifications/${notificationId}/`, {
                    method: 'DELETE',
                    headers: headers
                });
                
                if (res.ok || res.status === 204 || res.status === 404) {
                    // Succès ou déjà supprimée, l'UI est déjà mise à jour
                } else {
                    const error = await res.json().catch(() => ({}));
                    console.error('Erreur lors de la suppression:', res.status, error);
                }
            } catch (error) {
                console.error('Erreur lors de la suppression de la notification:', error);
            }
        }
        
        // Supprimer toutes les notifications
        async function clearAllNotifications() {
            if (!confirm('Êtes-vous sûr de vouloir supprimer toutes les notifications ?')) {
                return;
            }
            
            try {
                const headers = await getHeaders();
                const res = await fetch('/api/notifications/clear-all/', {
                    method: 'DELETE',
                    headers: headers
                });
                
                if (res.ok) {
                    notifications = [];
                    updateNotificationUI();
                }
            } catch (error) {
                console.error('Erreur lors de la suppression de toutes les notifications:', error);
            }
        }
        
        // Formater l'heure
        function formatTime(timestamp) {
            if (!timestamp) {
                return '';
            }
            
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) {
                console.warn('Date invalide:', timestamp);
                return '';
            }
            
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) { // Moins d'1 minute
                return 'À l\'instant';
            } else if (diff < 3600000) { // Moins d'1 heure
                return `Il y a ${Math.floor(diff / 60000)} min`;
            } else if (diff < 86400000) { // Moins d'1 jour
                return `Il y a ${Math.floor(diff / 3600000)} h`;
            } else {
                return date.toLocaleDateString();
            }
        }
        
        // Fermer le dropdown quand on clique ailleurs
        document.addEventListener('click', function(event) {
            const tab = document.getElementById('notification-tab');
            const dropdown = document.getElementById('notification-dropdown');
            
            if (!tab.contains(event.target) && isNotificationDropdownOpen) {
                isNotificationDropdownOpen = false;
                dropdown.classList.remove('show');
            }
        });
        
        // === CONVERSATION BADGES ===
        
        // Marquer une conversation comme lue
        async function markConversationAsRead(conversationId) {
            unreadCounts[conversationId] = 0;
            updateConversationBadge(conversationId, false);
            
            // Sauvegarder côté serveur
            try {
                const headers = await getHeaders();
                await fetch(`/api/conversations/${conversationId}/mark-read/`, {
                    method: 'POST',
                    headers: headers
                });
            } catch (error) {
                console.error('Erreur lors du marquage comme lu:', error);
            }
        }
        
        // Mettre à jour le badge d'une conversation
        function updateConversationBadge(conversationId, increment = false) {
            if (increment) {
                unreadCounts[conversationId] = (unreadCounts[conversationId] || 0) + 1;
            }
            
            const badge = document.getElementById(`badge-${conversationId}`);
            if (badge) {
                const count = unreadCounts[conversationId] || 0;
                if (count > 0) {
                    badge.textContent = count;
                    badge.style.display = 'inline-flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        }
    </script>
</body>
