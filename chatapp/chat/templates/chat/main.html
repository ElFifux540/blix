<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Accueil</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e1f22; /* Discord-ish dark */
            color: #e3e5e8;
        }
        .app-shell {
            display: grid;
            grid-template-columns: 72px 280px 1fr;
            grid-template-rows: 48px 1fr;
            grid-template-areas:
                "header header header"
                "servers channels main";
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .header {
            grid-area: header;
            background: #2b2d31;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }
        .servers-rail {
            grid-area: servers;
            background: #1f2124;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 12px 8px;
            overflow-y: auto;
        }
        .server-bubble {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #313338;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e3e5e8;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            user-select: none;
        }
        .server-bubble:hover { transform: translateY(-1px); background: #3a3c41; }
        .server-bubble.active { background: #5865f2; }
        .server-bubble .badge { position: absolute; margin-left: 28px; }

        .channels-pane {
            grid-area: channels;
            background: #2b2d31;
            border-right: 1px solid #202225;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        .channels-header {
            padding: 12px;
            font-weight: bold;
            border-bottom: 1px solid #202225;
        }
        .channel-list { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 8px; }
        .channel-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            color: #c7c9ce;
        }
        .channel-item:hover, .channel-item.active { background: #3a3c41; color: #fff; }

        .main-pane {
            grid-area: main;
            background: #313338;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .main-header { padding: 12px 16px; border-bottom: 1px solid #202225; font-weight: bold; }
        .messages { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 16px; }
        .composer { padding: 12px 16px; border-top: 1px solid #202225; display: flex; gap: 8px; position: relative; }
        .composer input { flex: 1; background: #1e1f22; border: 1px solid #3a3c41; border-radius: 8px; color: #fff; padding: 10px 12px; }
        
        /* Drag & Drop pour la zone de conversation */
        .main-pane.drag-over { 
            background: #2a3c51; 
            border: 3px dashed #5865f2; 
            position: relative;
        }
        .drag-overlay { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            background: rgba(88, 101, 242, 0.9); 
            border: 2px solid #5865f2; 
            border-radius: 12px; 
            padding: 30px 50px;
            display: none; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: bold; 
            font-size: 18px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(88, 101, 242, 0.3);
            backdrop-filter: blur(10px);
        }
        .main-pane.dragging .drag-overlay { display: flex; }
        .btn { background: #5865f2; color: white; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; }
        .btn:hover { filter: brightness(1.05); }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            display: block;
            width: fit-content;
            max-width: 90%;
            min-width: 30%;
            overflow-wrap: anywhere;
        }
        .message.own { background: #5865f2; color: #fff; margin-left: auto; margin-right: 0; }
        .message.other { background: #1f2124; color: #e3e5e8; margin-left: 0; margin-right: auto; }

        .notification {
            position: fixed; top: 20px; right: 20px; padding: 15px 20px; border-radius: 5px; color: white; font-weight: bold; z-index: 1000; display: none;
        }
        .notification.success { background: #28a745; }
        .notification.error { background: #dc3545; }
        .notification.info { background: #17a2b8; }
        .form-group { 
            margin-bottom: 15px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            box-sizing: border-box; 
        }
        .btn { 
            background: #007bff; 
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            margin-right: 10px; 
        }
        .btn:hover { 
            background: #0056b3; 
        }
        .btn-success { 
            background: #28a745; 
        }
        .btn-danger { 
            background: #dc3545; 
        }
        .btn-warning { 
            background: #ffc107; 
            color: #212529; 
        }
        .list { 
            max-height: 300px; 
            overflow-y: auto; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            padding: 10px; 
        }
        .list-item { 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .list-item:last-child { 
            border-bottom: none; 
        }
        .notification { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            padding: 15px 20px; 
            border-radius: 5px; 
            color: white; 
            font-weight: bold; 
            z-index: 1000; 
            display: none; 
        }
        .notification.success { 
            background: #28a745; 
        }
        .notification.error { 
            background: #dc3545; 
        }
        .notification.info { 
            background: #17a2b8; 
        }
        .badge { 
            background: #dc3545; 
            color: white; 
            border-radius: 50%; 
            padding: 2px 6px; 
            font-size: 12px; 
            margin-left: 10px; 
        }
        .chat-window { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            width: 350px; 
            height: 400px; 
            background: white; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); 
            display: none; 
            flex-direction: column; 
        }
        .chat-header { 
            background: #007bff; 
            color: white; 
            padding: 15px; 
            border-radius: 10px 10px 0 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .chat-messages { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            max-height: 250px; 
        }
        .chat-input { 
            padding: 15px; 
            border-top: 1px solid #ddd; 
            display: flex; 
        }
        .chat-input input { 
            flex: 1; 
            padding: 8px; 
            border: 1px solid #ddd; 
            border-radius: 20px; 
            margin-right: 10px; 
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            display: block;
            width: fit-content;
            max-width: 90%;
            min-width: 30%;
            overflow-wrap: anywhere;
        }
        .message.own {
            background: #007bff;
            color: white;
            margin-left: auto;
            margin-right: 0;
        }
        .message.other {
            background: #f1f3f4;
            color: #333;
            margin-left: 0;
            margin-right: auto;
        }
        
        /* Système de notifications */
        .notification-popup {
            position: fixed;
            top: 70px;
            right: 20px;
            background: #2b2d31;
            border: 1px solid #3a3c41;
            border-radius: 8px;
            padding: 16px;
            min-width: 300px;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            color: #e3e5e8;
        }
        .notification-popup.show { transform: translateX(0); }
        .notification-popup.hide { transform: translateX(100%); }
        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .notification-title {
            font-weight: bold;
            color: #5865f2;
        }
        .notification-close {
            background: none;
            border: none;
            color: #8e9297;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            width: 20px;
            height: 20px;
        }
        .notification-body {
            font-size: 14px;
            line-height: 1.4;
        }
        .notification-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        .notification-btn {
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .notification-btn:hover { background: #4752c4; }
        
        /* Mini-onglet notifications dans le header */
        .notification-mini-tab {
            position: relative;
            cursor: pointer;
            padding: 8px 12px;
            background: #3a3c41;
            border-radius: 6px;
            color: #e3e5e8;
            font-size: 14px;
            transition: background 0.2s;
        }
        .notification-mini-tab:hover { background: #4a4c51; }
        .notification-mini-tab.has-notifications { background: #5865f2; }
        .notification-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #dc3545;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        /* Dropdown des notifications */
        .notification-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #2b2d31;
            border: 1px solid #3a3c41;
            border-radius: 8px;
            min-width: 280px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1001;
            display: none;
        }
        .notification-dropdown.show { display: block; }
        .notification-item {
            padding: 12px 16px;
            border-bottom: 1px solid #3a3c41;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .notification-item:hover { background: #3a3c41; }
        .notification-item:last-child { border-bottom: none; }
        .notification-item-title {
            font-weight: bold;
            color: #e3e5e8;
            margin-bottom: 4px;
        }
        .notification-item-content {
            font-size: 12px;
            color: #8e9297;
            margin-bottom: 4px;
        }
        .notification-item-time {
            font-size: 10px;
            color: #6a6d72;
        }
        .notification-empty {
            padding: 20px;
            text-align: center;
            color: #8e9297;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="header">
            <div>💬 Chat App</div>
            <div style="display:flex; align-items:center; gap:12px;">
                <span>Bienvenue, <strong id="username">{{ user.username }}</strong></span>
                <div class="notification-mini-tab" id="notification-tab" onclick="toggleNotificationDropdown()">
                    🔔 Notifications
                    <div class="notification-count" id="notification-count" style="display: none;">0</div>
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-empty" id="notification-empty">Rien à signaler par ici</div>
                    </div>
                </div>
                <form method="post" action="/accounts/logout/" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" style="background: none; border: none; color: #e3e5e8; text-decoration: underline; cursor: pointer;">Se déconnecter</button>
                </form>
            </div>
        </div>

        <aside class="servers-rail" id="servers-rail">
            <div class="server-bubble" id="server-menu" title="Menus" onclick="selectServer('menus')">≡</div>
            <div class="server-bubble active" id="server-direct" title="Privés" onclick="selectServer('direct')">💬</div>
            <div class="server-bubble" id="server-groups" title="Groupes" onclick="selectServer('groups')">👥</div>
        </aside>

        <section class="channels-pane">
            <div class="channels-header" id="channels-title">Conversations</div>
            <div class="channel-list" id="channel-list"></div>
            <div style="padding:12px; border-top:1px solid #202225;" id="channels-actions"></div>
        </section>

        <main class="main-pane" id="main-pane">
            <div class="drag-overlay">📎 Déposez votre fichier ici</div>
            <div class="main-header" id="main-title">Sélectionnez une conversation</div>
            <div class="messages" id="chat-messages"></div>
            <div class="composer" id="composer">
                <input type="file" id="file-input" style="max-width: 260px;" />
                <input type="text" id="message-input" placeholder="Tapez votre message..." onkeypress="handleKeyPress(event)">
                <button class="btn" onclick="sendMessage()">Envoyer</button>
            </div>
        </main>
    </div>
    
    <!-- Notifications -->
    <div id="notification" class="notification"></div>
    
    <!-- Notification popup -->
    <div id="notification-popup" class="notification-popup">
        <div class="notification-header">
            <div class="notification-title" id="popup-title">Notification</div>
            <button class="notification-close" onclick="closeNotificationPopup()">×</button>
        </div>
        <div class="notification-body" id="popup-body">Contenu de la notification</div>
        <div class="notification-actions" id="popup-actions" style="display: none;">
            <button class="notification-btn" id="popup-action-btn">Action</button>
        </div>
    </div>
    
    <script>
        let currentConversation = null;
        let ws = null;
        let notificationWs = null;
        let unreadCounts = {};
        let messages = []; // Stocker les messages pour gérer l'affichage des dates
        
        // Système de notifications
        let notifications = [];
        let notificationTimeout = null;
        let isNotificationDropdownOpen = false;
        
        // Récupérer le token CSRF
        let csrfToken = null;
        
        async function getCSRFToken() {
            if (csrfToken) return csrfToken;
            
            try {
                const res = await fetch('/api/csrf-token/');
                const data = await res.json();
                csrfToken = data.csrfToken;
                return csrfToken;
            } catch (error) {
                console.error('Erreur lors de la récupération du token CSRF:', error);
                return null;
            }
        }
        
        // Headers par défaut avec CSRF
        async function getHeaders() {
            const token = await getCSRFToken();
            return {
                'Content-Type': 'application/json',
                'X-CSRFToken': token
            };
        }
        
        // État de la colonne de gauche (rail + channels)
        let currentServer = 'direct'; // 'menus' | 'direct' | 'groups'
        function selectServer(kind) {
            currentServer = kind;
            document.querySelectorAll('.server-bubble').forEach(b => b.classList.remove('active'));
            if (kind === 'menus') document.getElementById('server-menu').classList.add('active');
            if (kind === 'direct') document.getElementById('server-direct').classList.add('active');
            if (kind === 'groups') document.getElementById('server-groups').classList.add('active');
            renderChannels();
            refreshSelectors();
        }
        
        // Charger les conversations
        async function loadConversations() {
            try {
                const headers = await getHeaders();
                const [directRes, groupRes] = await Promise.all([
                    fetch('/api/conversations/by-type/?type=direct', {
                        headers: headers
                    }),
                    fetch('/api/conversations/by-type/?type=group', {
                        headers: headers
                    })
                ]);
                
                const directConvs = await directRes.json();
                const groupConvs = await groupRes.json();
                
                window.__directConvs = directConvs;
                window.__groupConvs = groupConvs;
                renderChannels();
            } catch (error) {
                showNotification('Erreur lors du chargement des conversations', 'error');
            }
        }
        
        function renderChannels() {
            const list = document.getElementById('channel-list');
            const actions = document.getElementById('channels-actions');
            const title = document.getElementById('channels-title');
            list.innerHTML = '';
            actions.innerHTML = '';
            if (currentServer === 'menus') {
                title.textContent = 'Menus';
                // Menus: Contacts + Invitations
                const menus = [
                    { id: 'menu-contacts', label: 'Contacts', onClick: () => loadContactsPanel() },
                    { id: 'menu-invitations', label: 'Invitations', onClick: () => loadInvitationsPanel() }
                ];
                menus.forEach(menu => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.textContent = menu.label;
                    item.onclick = menu.onClick;
                    list.appendChild(item);
                });
            } else if (currentServer === 'direct') {
                title.textContent = 'Conversations privées';
                (window.__directConvs || []).forEach(conv => {
                    const otherUser = conv.memberships?.find(m => m.user.id !== {{ user.id|escapejs }})?.user;
                    const displayName = otherUser ? otherUser.username : `Direct ${conv.id}`;
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `<span>@ ${displayName}</span><span class="badge" id="badge-${conv.id}" style="display:none;">0</span>`;
                    item.onclick = () => openChat(conv.id, displayName);
                    list.appendChild(item);
                });
                // Action: créer direct
                const actionsHtml = `
                    <div style="display:flex; gap:8px; align-items:center;">
                        <select id="contact-select" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                            <option value="">-- Choisir un contact --</option>
                        </select>
                        <button class="btn" onclick="createDirectFromContact()">Créer</button>
                    </div>`;
                actions.innerHTML = actionsHtml;
            } else if (currentServer === 'groups') {
                title.textContent = 'Groupes';
                (window.__groupConvs || []).forEach(conv => {
                    const displayName = conv.name || `Groupe ${conv.id}`;
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `<span># ${displayName}</span><span class="badge" id="badge-${conv.id}" style="display:none;">0</span>`;
                    item.onclick = () => openChat(conv.id, displayName);
                    list.appendChild(item);
                });
                const actionsHtml = `
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div style="display:flex; gap:8px;">
                            <input type="text" id="group-name" placeholder="Nom du groupe" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                            <button class="btn" onclick="createGroupConversation()">Créer</button>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <select id="group-select" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                                <option value="">-- Choisir un groupe --</option>
                            </select>
                            <select id="group-invite-select" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                                <option value="">-- Choisir un contact --</option>
                            </select>
                            <input type="text" id="group-invite-username" placeholder="Ou nom d'utilisateur" style="flex:1; background:#1e1f22; color:#e3e5e8; border:1px solid #3a3c41; border-radius:8px; padding:8px;">
                            <button class="btn" onclick="inviteToGroup()">Inviter</button>
                        </div>
                    </div>`;
                actions.innerHTML = actionsHtml;
            }
        }
        
        // Charger les contacts
        async function loadContacts() {
            try {
                const headers = await getHeaders();
                const [pendingRes, acceptedRes] = await Promise.all([
                    fetch('/api/contacts/pending/', {
                        headers: headers
                    }),
                    fetch('/api/contacts/accepted/', {
                        headers: headers
                    })
                ]);
                
                const pendingContacts = await pendingRes.json();
                const acceptedContacts = await acceptedRes.json();
                
                displayPendingContacts(pendingContacts);
                displayAcceptedContacts(acceptedContacts);
            } catch (error) {
                showNotification('Erreur lors du chargement des contacts', 'error');
            }
        }
        
        function displayPendingContacts(contacts) {
            const container = document.getElementById('pending-contacts');
            container.innerHTML = '';
            
            contacts.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <span>Demande de ${contact.from_user.username}</span>
                    <div>
                        <button class="btn btn-success" onclick="respondToContact(${contact.id}, 'accepted')">Accepter</button>
                        <button class="btn btn-danger" onclick="respondToContact(${contact.id}, 'blocked')">Refuser</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        function displayAcceptedContacts(contacts) {
            const container = document.getElementById('accepted-contacts');
            container.innerHTML = '';
            
            contacts.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'list-item';
                const otherUser = contact.from_user.username === '{{ user.username|escapejs }}' ? contact.to_user.username : contact.from_user.username;
                div.innerHTML = `
                    <span>${otherUser}</span>
                    <div>
                        <button class="btn btn-danger" onclick="deleteContact(${contact.id})" style="background-color: #dc3545; color: white; padding: 4px 8px; font-size: 12px;">Supprimer</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        // Charger les invitations
        async function loadInvitations() {
            try {
                const headers = await getHeaders();
                const res = await fetch('/api/group-invitations/pending/', {
                    headers: headers
                });
                const invitations = await res.json();
                
                displayInvitations(invitations);
            } catch (error) {
                showNotification('Erreur lors du chargement des invitations', 'error');
            }
        }
        
        function displayInvitations(invitations) {
            const container = document.getElementById('pending-invitations');
            container.innerHTML = '';
            
            invitations.forEach(invitation => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <span>Invitation dans "${invitation.conversation.name}" de ${invitation.from_user.username}</span>
                    <div>
                        <button class="btn btn-success" onclick="respondToInvitation(${invitation.id}, 'accepted')">Accepter</button>
                        <button class="btn btn-danger" onclick="respondToInvitation(${invitation.id}, 'declined')">Refuser</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        // Fonctions de contact
        async function sendContactRequest() {
            const username = document.getElementById('contact-username').value;
            if (!username) return;
            
            try {
                const headers = await getHeaders();
                const res = await fetch('/api/contacts/send-request/', {
                    method: 'POST',

                if (data.message) {
                    messages.push(data.message);
                    const prevMsg = messages.length > 1 ? messages[messages.length - 2] : null;

                } else if (data.error) {
                    showNotification(data.error, 'error');

        function isImageFile(filename) {
            if (!filename) return false;
            const lower = filename.toLowerCase();
            return [".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp", ".svg"].some(ext => lower.endsWith(ext));
        }

        function displayMessage(msg, prevMsg = null) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            const senderId = (msg.sender && typeof msg.sender === 'object' && msg.sender.id) ? msg.sender.id : (typeof msg.sender === 'number' ? msg.sender : null);
            const isOwn = senderId === {{ user.id }};
            div.className = `message ${isOwn ? 'own' : 'other'}`;
            
            // Gérer l'affichage du nom d'utilisateur
            let senderName = 'Utilisateur';
            if (msg.sender_username) {
                senderName = msg.sender_username;
            } else if (msg.sender && typeof msg.sender === 'object' && msg.sender.username) {
                senderName = msg.sender.username;
            } else if (msg.sender && typeof msg.sender === 'string') {
                senderName = msg.sender;
            }
            
            let attachmentHtml = '';
            const url = msg.attachment_url;
            if (url) {
                if (isImageFile(url)) {
                    attachmentHtml = `<div style="margin-top:6px;"><img src="${url}" alt="fichier" style="max-width: 320px; border-radius: 6px;" /></div>`;
                } else {
                    const filename = url.split('/').pop();
                    attachmentHtml = `<div style="margin-top:6px;"><a href="${url}" target="_blank" download rel="noopener">📎 Télécharger ${filename}</a></div>`;
                }
            }
            
            // Vérifier si on doit afficher la date (changement de jour)
            const msgDate = new Date(msg.created_at);
            let dateHtml = '';
            if (!prevMsg) {
                dateHtml = `<div style="text-align:center; margin:10px 0; color:#8e9297; font-size:11px;">${msgDate.toLocaleDateString()}</div>`;
            } else {
                const prevMsgDate = new Date(prevMsg.created_at);
                if (msgDate.toDateString() !== prevMsgDate.toDateString()) {
                    dateHtml = `<div style="text-align:center; margin:10px 0; color:#8e9297; font-size:11px;">${msgDate.toLocaleDateString()}</div>`;
                }
            }

            div.innerHTML = `
                ${dateHtml}
                <strong>${senderName}:</strong> ${msg.content || ''}
                ${attachmentHtml}
                <br><small>${new Date(msg.created_at).toLocaleTimeString()}</small>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const fileInput = document.getElementById('file-input');
            const message = (input.value || '').trim();
            const file = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;

            if (!currentConversation) return;

            // Si un fichier est présent, on utilise l'API REST (multipart)
            if (file) {
                try {
                    const token = await getCSRFToken();
                    const form = new FormData();
                    form.append('content', message);
                    form.append('attachment', file);
                    const res = await fetch(`/api/conversations/${currentConversation}/send/`, {
                        method: 'POST',
                        headers: { 'X-CSRFToken': token },
                        body: form
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        showNotification(err.detail || 'Erreur envoi du fichier', 'error');
                        return;
                    }
                    // La diffusion temps réel arrivera via WebSocket (broadcast côté serveur)
                    input.value = '';
                    fileInput.value = '';
                } catch (e) {
                    showNotification('Erreur réseau lors de l\'upload', 'error');
                }
                return;
            }

            // Sinon, on garde le flux WebSocket pour le texte seul
            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({message}));
            input.value = '';
        }

        // === DRAG & DROP FUNCTIONALITY ===
        function setupDragAndDrop() {
            const mainPane = document.getElementById('main-pane');
            const fileInput = document.getElementById('file-input');
            
            // Empêcher le comportement par défaut sur tout le document
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                document.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            // Gestion des événements de drag sur la zone principale
            ['dragenter', 'dragover'].forEach(eventName => {
                mainPane.addEventListener(eventName, handleDragEnter, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                mainPane.addEventListener(eventName, handleDragLeave, false);
            });
            
            mainPane.addEventListener('drop', handleDrop, false);
            
            function handleDragEnter(e) {
                mainPane.classList.add('dragging');
                mainPane.classList.add('drag-over');
            }
            
            function handleDragLeave(e) {
                // Ne retirer la classe que si on quitte vraiment la zone
                if (!mainPane.contains(e.relatedTarget)) {
                    mainPane.classList.remove('dragging');
                    mainPane.classList.remove('drag-over');
                }
            }
            
            function handleDrop(e) {
                mainPane.classList.remove('dragging');
                mainPane.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    // Afficher un message de confirmation
                    showNotification(`Fichier sélectionné : ${files[0].name}`, 'info');
                }
            }
        }

        function setupNotificationWebSocket() {
            const protocol = window.location.protocol === "https:" ? "wss" : "ws";

            notificationWs.onopen = () => {
            };

                if (data.type === 'notification') {

                    notifications.unshift(notification);
                    updateNotificationUI();

            notificationWs.onclose = () => {

            const actions = document.getElementById('popup-actions');
            const actionBtn = document.getElementById('popup-action-btn');
            
            if (!popup || !title || !body) {
                return;
            }
            
            title.textContent = notification.title;
            body.textContent = notification.content;
            
            if (notification.action) {
                if (actionBtn && actions) {
                    actionBtn.textContent = notification.action.label || 'Voir';
                    actionBtn.onclick = () => handleNotificationAction(notification);
                    actions.style.display = 'flex';
                }
            } else {
                if (actions) {
                    actions.style.display = 'none';
                }
            }
            
            popup.classList.remove('hide');
            popup.style.display = 'block';
            popup.classList.add('show');
            
            // Auto-hide après 5 secondes
            if (notificationTimeout) {
                clearTimeout(notificationTimeout);
            }
            notificationTimeout = setTimeout(() => {
                closeNotificationPopup();
            }, 5000);
        }
        
        // Fermer le popup de notification
        function closeNotificationPopup() {
            const popup = document.getElementById('notification-popup');
            popup.classList.remove('show');
            popup.classList.add('hide');
            
            setTimeout(() => {
                popup.classList.remove('hide');
                popup.style.display = 'none';
            }, 300);
        }
        
        // Basculer le dropdown des notifications
        function toggleNotificationDropdown() {
            const dropdown = document.getElementById('notification-dropdown');
            isNotificationDropdownOpen = !isNotificationDropdownOpen;
            
            if (isNotificationDropdownOpen) {
                dropdown.classList.add('show');
            } else {
                dropdown.classList.remove('show');
            }
        }
        
        // Gérer le clic sur une notification
        function handleNotificationClick(notification) {
            // Marquer comme lue
            notification.read = true;
            updateNotificationUI();
            
            // Fermer le dropdown
            isNotificationDropdownOpen = false;
            document.getElementById('notification-dropdown').classList.remove('show');
            
            // Exécuter l'action si elle existe
            if (notification.action) {
                handleNotificationAction(notification);
            }
            
            // Sauvegarder le changement côté serveur
            markNotificationAsRead(notification.id);
        }
        
        // Gérer l'action d'une notification
        function handleNotificationAction(notification) {
            if (notification.type === 'message') {
                // Ouvrir la conversation correspondante
                if (notification.action.conversationId) {
                    const conv = [...(window.__directConvs || []), ...(window.__groupConvs || [])]
                        .find(c => c.id === notification.action.conversationId);
                    if (conv) {
                        const title = conv.name || conv.memberships?.find(m => m.user.id !== {{ user.id|escapejs }})?.user?.username || `Conversation ${conv.id}`;
                        openChat(notification.action.conversationId, title);
                    }
                }
            } else if (notification.type === 'contact') {
                // Aller au menu contacts
                selectServer('menus');
                loadContactsPanel();
            } else if (notification.type === 'group') {
                // Aller au menu invitations
                selectServer('menus');
                loadInvitationsPanel();
            }
        }
        
        // Marquer une notification comme lue côté serveur
        async function markNotificationAsRead(notificationId) {
            try {
                // Envoyer via WebSocket
                if (notificationWs && notificationWs.readyState === WebSocket.OPEN) {
                    notificationWs.send(JSON.stringify({
                        action: 'mark_read',
                        notification_id: notificationId
                    }));
                } else {
                    // Fallback via API REST
                    const headers = await getHeaders();
                    await fetch(`/api/notifications/${notificationId}/mark-read/`, {
                        method: 'POST',
                        headers: headers
                    });
                }
            } catch (error) {
                console.error('Erreur lors du marquage de la notification comme lue:', error);
            }
        }
        
        // Supprimer une notification
        async function deleteNotification(notificationId) {
            // Retirer immédiatement de la liste locale pour un feedback instantané
            notifications = notifications.filter(n => n.id !== notificationId);
            updateNotificationUI();
            
            try {
                const headers = await getHeaders();
                const res = await fetch(`/api/notifications/${notificationId}/`, {
                    method: 'DELETE',
                    headers: headers
                });
                
                if (res.ok || res.status === 204 || res.status === 404) {
                    // Succès ou déjà supprimée, l'UI est déjà mise à jour
                } else {
                    const error = await res.json().catch(() => ({}));
                    console.error('Erreur lors de la suppression:', res.status, error);
                }
            } catch (error) {
                console.error('Erreur lors de la suppression de la notification:', error);
            }
        }
        
        // Supprimer toutes les notifications
        async function clearAllNotifications() {
            if (!confirm('Êtes-vous sûr de vouloir supprimer toutes les notifications ?')) {
                return;
            }
            
            try {
                const headers = await getHeaders();
                const res = await fetch('/api/notifications/clear-all/', {
                    method: 'DELETE',
                    headers: headers
                });
                
                if (res.ok) {
                    notifications = [];
                    updateNotificationUI();
                }
            } catch (error) {
                console.error('Erreur lors de la suppression de toutes les notifications:', error);
            }
        }
        
        // Formater l'heure
        function formatTime(timestamp) {
            if (!timestamp) {
                return '';
            }
            
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) {
                console.warn('Date invalide:', timestamp);
                return '';
            }
            
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) { // Moins d'1 minute
                return 'À l\'instant';
            } else if (diff < 3600000) { // Moins d'1 heure
                return `Il y a ${Math.floor(diff / 60000)} min`;
            } else if (diff < 86400000) { // Moins d'1 jour
                return `Il y a ${Math.floor(diff / 3600000)} h`;
            } else {
                return date.toLocaleDateString();
            }
        }
        
        // Fermer le dropdown quand on clique ailleurs
        document.addEventListener('click', function(event) {
            const tab = document.getElementById('notification-tab');
            const dropdown = document.getElementById('notification-dropdown');
            
            if (!tab.contains(event.target) && isNotificationDropdownOpen) {
                isNotificationDropdownOpen = false;
                dropdown.classList.remove('show');
            }
        });
        
        // === CONVERSATION BADGES ===
        
        // Marquer une conversation comme lue
        async function markConversationAsRead(conversationId) {
            unreadCounts[conversationId] = 0;
            updateConversationBadge(conversationId, false);
            
            // Sauvegarder côté serveur
            try {
                const headers = await getHeaders();
                await fetch(`/api/conversations/${conversationId}/mark-read/`, {
                    method: 'POST',
                    headers: headers
                });
            } catch (error) {
                console.error('Erreur lors du marquage comme lu:', error);
            }
        }
        
        // Mettre à jour le badge d'une conversation
        function updateConversationBadge(conversationId, increment = false) {
            if (increment) {
                unreadCounts[conversationId] = (unreadCounts[conversationId] || 0) + 1;
            }
            
            const badge = document.getElementById(`badge-${conversationId}`);
            if (badge) {
                const count = unreadCounts[conversationId] || 0;
                if (count > 0) {
                    badge.textContent = count;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
